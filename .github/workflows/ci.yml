# CI：push(main)、PR 与手动触发的持续集成。
# unit 跑构建、类型检查与单元契约测试；integration 在 xvfb 虚拟显示下经
# @vscode/test-electron 以真实 VSCode 1.82.3 宿主（#255 承诺下界）跑集成
# 套件；四个 runner 各跑 core 一片、每个 runner 仍只启动一个宿主；第五组
# 独立运行敏感用例；# browser 用 Playwright chromium 跑 test:browser 原生输入回归（#50）。
# job 名 unit / integration 同时是 main 分支保护的必需状态检查。
# integration_shard 为矩阵 job，integration 汇总四片并保留稳定检查名；
# 改名、增删必需检查前需同步分支保护规则，否则保护会因找不到检查而挂起。
# integration-sensitive 不加入 integration 的 needs，也不吞退出码：第五组
# 失败仍显示红灯并留报告，但不阻断现有必需检查。名单及退出条件见
# docs/specs/integration-test-groups.md（2026-10-01 用户授权）。
# browser 暂未纳入必需检查（2026-09 核查保护规则仅含 unit / integration）：
# 其失败不阻塞合并但会在 PR 状态区显示；是否升为必需由维护者视其稳定性决定，
# 升级前无需改本文件，仅需在仓库设置中加入 browser 上下文。
# style-contract（#135）为历史 CSS 契约兼容检查（#134 检查器的 CI 接线），
# 与 unit / integration 同为合并必需检查候选：job 名即 required status check
# 的 context 名（稳定、独立可查）。2026-09-27 实读远端保护规则仅含
# unit / integration——把 style-contract 加入必需名单需仓库 admin 权限与
# 用户授权，操作步骤见 docs/specs/style-contract-gate.md；名单更新前，
# 其失败只显示在 PR 状态区，不阻塞合并（不得表述为已阻止合并）。
# 步骤序是防线核心（先证检查器可信，再信检查结果）：
#   1. --verify-baseline 从 git 对象（v0.4.0 tag 固定 SHA）复验候选基线
#      文件——候选篡改历史基线在契约检查之前即失败；
#   2. 打印检查器/基线/工作流文件相对 PR 基点的变更统计到 step summary，
#      变更本身不失败，但使「检查器/基线变更须独立说明审查」（AGENTS 硬
#      约定）在 PR Summary 可见；
#   3. 全量契约检查（基线比较 + 指南一致性 + 期限与发布记录三源交叉）。
# 报告无论成败均上传（if: always()，沿用 browser job 报告上传先例）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # test:unit 链含 checkStyleContract 契约测试，需从 git 对象读
          # 基线 sourceSha（75c3df7）的映射表原文做锚定复验；浅克隆缺对象
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建与类型检查
        run: npm run compile
      - name: 单元测试
        run: npm run test:unit

  style-contract:
    name: style-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # verify-baseline 需从 git 对象读 v0.4.0 固定 SHA（75c3df7）的
          # 映射表，发布记录交叉验证需 refs/tags；浅克隆两者皆缺
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 复验历史基线与 git 锚定内容一致
        # 先证检查器可信：候选改 test/style-contract/baseline-v0.4.0.json
        # （抹历史承诺）在此拦截，失败时后续契约检查不再执行
        run: npm run check:stylecontract:baseline
      - name: 暴露检查器与基线相对 PR 基点的变更（供独立审查）
        # 变更不失败（合法演进路径），但统计写入 step summary：PR 评审在
        # Summary 页一眼可见「检查器/基线/门禁工作流被本 PR 修改」，配合
        # AGENTS「检查器/CI/基线变更须独立列出理由」约定与必需检查构成
        # 「候选不得静默替换检查器」的机制——本地工作流无法自证不被删除，
        # 可见性 + 远端必需检查 + 工作流文件变更走 PR 审查才是完整防线
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.sha }}"
          {
            echo "## 检查器与基线变更审查（style-contract）"
            echo "对比基点：\`$BASE\`（push(main) 时即 HEAD，diff 恒为空）"
            echo '```diff'
            git diff --stat "$BASE"...HEAD -- \
              scripts/checkStyleContract.mjs scripts/styleContractCheck.mjs \
              test/style-contract/ .github/workflows/ci.yml .github/workflows/release.yml
            echo '```'
            echo '以上文件若出现在本 PR 的变更中，须在 PR 描述独立列出理由与保护效果（AGENTS「公开样式契约」）。'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 历史 CSS 契约兼容检查
        # 再信检查结果：基线比较 + 指南一致性 + 期限与发布记录交叉验证，
        # 失败即 job 失败（JSON 报告由后续步骤保留）
        run: npm run check:stylecontract
      - name: 保存契约检查报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: style-contract-report
          path: out/test/style-contract-report.json
          if-no-files-found: warn

  integration_shard:
    name: integration shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 安装 VSCode 宿主所需系统库
        run: |
          sudo apt-get update
          # ubuntu 24.04 起 ALSA/GTK/ATK 库迁入 *t64 实体包，旧名只剩虚包无法安装
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0t64 libdrm2 \
            libxkbcommon0 libgbm1 libasound2t64 libgtk-3-0t64 libsecret-1-0 libxkbfile1
      - name: 集成测试（真实 1.82.3 宿主）
        env:
          VSIDIAN_TEST_GROUP: core
          VSIDIAN_TEST_SHARD: ${{ matrix.shard }}/4
        run: xvfb-run -a npm run test:integration
      - name: 保存强制分片完整报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-core-s${{ matrix.shard }}-a${{ github.run_attempt }}
          path: .vscode-test/integration-dev.log
          if-no-files-found: warn

  integration-sensitive:
    name: integration-sensitive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 安装 VSCode 宿主所需系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0t64 libdrm2 \
            libxkbcommon0 libgbm1 libasound2t64 libgtk-3-0t64 libsecret-1-0 libxkbfile1
      - name: 第五组敏感用例（真实 1.82.3 宿主）
        env:
          VSIDIAN_TEST_GROUP: sensitive
        run: xvfb-run -a npm run test:integration
      - name: 保存敏感组完整报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-sensitive-a${{ github.run_attempt }}
          path: .vscode-test/integration-sensitive.log
          if-no-files-found: warn

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: integration_shard
    if: ${{ always() }}
    steps:
      - name: 核验全部集成测试分片通过
        env:
          SHARD_RESULT: ${{ needs.integration_shard.result }}
        run: test "$SHARD_RESULT" = success

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      # 浏览器二进制缓存：playwright 是直接 devDependency 且精确锁版本
      # （package.json 无 ^），故以 lockfile 哈希作 key——lockfile 变更即
      # 视为浏览器版本可能更新。其他依赖变更会偶发触发整缓存重下载
      # （多一次 ~170 MB 下载），换来 key 无需手工维护版本号；不用
      # restore-keys：恢复过期浏览器目录只会让 install 判定版本不符再
      # 下载一遍，白花恢复时间。
      - name: 缓存 Playwright 浏览器二进制
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: 安装 Chromium
        # --with-deps 无条件执行（不按 cache-hit 条件化拆分）：缓存只覆盖
        # 浏览器二进制，系统库随 runner 镜像漂移；命中缓存时 playwright
        # 检测到二进制已存在会跳过下载，apt 部分幂等（约 20s），保留它比
        # 拆出 install-deps 分支更简单，也不损失系统库确定性。
        run: npx playwright install --with-deps chromium
      - name: 浏览器原生输入回归
        # 与本地一致性：tableCaret.mjs 默认 Playwright chromium 通道，
        # CI 与本机（npx playwright install chromium 后）跑同一套二进制；
        # VSIDIAN_TEST_BROWSER_CHANNEL=msedge 仅供 Windows 本机借系统
        # Edge 调试，不进 CI。
        run: npm run test:browser
      - name: 保存浏览器计时与失败日志
        # 名称带 attempt 号（#164）：gh run rerun 后新 attempt 同名上传会
        # 覆盖旧报告，失败现场丢失——按 attempt 分名后每次重跑的报告都保留
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports-a${{ github.run_attempt }}
          path: |
            out/test/browser-runs/run-*/report.json
            out/test/browser-runs/run-*/report.md
            out/test/browser-runs/run-*/*.log
            out/test/browser-runs/run-*/*.phases.jsonl
          if-no-files-found: ignore

  # #344（P3-12 收口）真宿主高亮对照套件接线：#340 产出的生产
  # TextAppearanceService 对照（语法层颜色与 #335 探针锚点一致）。与常规
  # 集成回归的差异：不 --disable-extensions（内置语言/主题扩展必须在场）
  # 并预置 Default Dark Modern——单宿主单轮，报告 .vscode-test/text-appearance.log。
  # 与 browser 同为非必需检查（2026-09 核查保护规则仅含 unit / integration /
  # style-contract）；失败红灯保留完整报告，不阻断必需检查。
  text-appearance:
    name: text-appearance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 安装 VSCode 宿主所需系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0t64 libdrm2 \
            libxkbcommon0 libgbm1 libasound2t64 libgtk-3-0t64 libsecret-1-0 libxkbfile1
      - name: 真宿主文本外观对照（1.82.3，内置扩展在场）
        run: xvfb-run -a npm run test:text-appearance
      - name: 保存对照报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: text-appearance-a${{ github.run_attempt }}
          path: .vscode-test/text-appearance.log
          if-no-files-found: warn
